<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book of Life Editor</title>
    <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/duotone/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/bold/style.css" />
    <script type="module" crossorigin src="/assets/editor-BGtt7f80.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/load-script-C4zpFZx5.js">
    <link rel="stylesheet" crossorigin href="/assets/editor-BBYCrS7_.css">
  </head>
  <body>
    <div class="editor-shell">
      <header class="editor-topbar">
        <div class="editor-topbar-left">
          <button id="editorBackButton" class="editor-icon-button" type="button" aria-label="Back"><i class="ph-bold ph-caret-left"></i></button>
          <div>
            <h1 id="editorTitle" class="editor-title">Entry</h1>
            <p id="editorSubtitle" class="editor-subtitle">Loading...</p>
          </div>
        </div>
        <div class="editor-topbar-right">
          <button id="undoButton" class="editor-icon-button" type="button" aria-label="Undo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
          <button id="redoButton" class="editor-icon-button" type="button" aria-label="Redo"><i class="ph-bold ph-arrow-clockwise"></i></button>
          <button id="saveButton" class="save-button" type="button" aria-label="Save entry"><i class="ph-bold ph-check"></i></button>
        </div>
      </header>

      <section class="editor-media-panel">
        <div id="editorPhotoStripWrap" class="editor-photo-strip-wrap">
          <div id="editorPhotoStrip" class="editor-photo-strip">
            <button id="editorUploadButton" class="editor-photo-thumb editor-upload-tile" type="button" aria-label="Upload media">
              <i class="ph-bold ph-upload-simple"></i>
              <span>Upload Media</span>
            </button>
          </div>
        </div>
      </section>

      <main class="editor-main">
        <div class="editor-meta-row">
          <div class="editor-mode-toggle" role="group" aria-label="Editor mode">
            <button id="editorModeRaw" class="editor-mode-button is-active" type="button" data-editor-mode="raw" aria-pressed="true">Raw text</button>
            <button id="editorModePreview" class="editor-mode-button" type="button" data-editor-mode="preview" aria-pressed="false">Preview</button>
          </div>
        </div>
        <div class="editor-surface-stack">
          <textarea id="editorTextarea" class="editor-textarea" spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
          <div id="editorPreview" class="editor-preview hidden" tabindex="0" aria-label="Rendered markdown preview"></div>
        </div>
      </main>
    </div>

    <div id="editorUploadModal" class="editor-upload-modal hidden" role="dialog" aria-modal="true" aria-label="Upload media">
      <div class="editor-upload-backdrop"></div>
      <div class="editor-upload-window">
        <div class="settings-window-head">
          <div>
            <h2 id="editorUploadTitle">Add media</h2>
          </div>
          <button id="editorUploadClose" class="editor-icon-button" type="button" aria-label="Close upload"><i class="ph-bold ph-x"></i></button>
        </div>
        <label class="editor-file-input hidden" aria-hidden="true">
          <input id="editorFileInput" type="file" multiple accept="image/*,video/*,.heic,.heif,.mov,.mp4,.m4v,.webm,.avi,.mkv,.3gp" />
        </label>
        <div id="editorUploadSelectionLoading" class="upload-selection-loading hidden" aria-live="polite"><i class="ph ph-spinner-gap is-spinning"></i><span>Preparing previews...</span></div>
        <div class="upload-context-row">
          <button id="editorDateModeToggle" class="upload-context-toggle" type="button">Uploading for</button>
          <button id="editorContextDateTrigger" class="upload-preview-trigger" type="button">May 8, 2026</button>
          <input id="editorSharedDate" class="upload-preview-picker-input" type="date" />
        </div>
        <div id="editorUploadPreviewList" class="upload-preview-list upload-preview-list-view"></div>
        <button id="editorFolderButton" class="editor-folder-button" type="button">
          <span class="upload-folder-icon"><i class="ph-duotone ph-folder-open"></i></span>
          <strong id="editorFolderLabel">Choose a folder</strong>
        </button>
        <div class="upload-folder-tree-shell editor-upload-folder-tree-shell">
          <button id="editorNewFolderButton" class="editor-icon-button" type="button" aria-label="Create folder"><i class="ph-bold ph-plus"></i></button>
          <div id="editorFolderTree" class="editor-folder-tree"></div>
        </div>
        <input id="editorSetExifDate" class="hidden" type="checkbox" />
        <button id="editorAddFilesButton" class="editor-file-picker" type="button">
          <span><i class="ph-bold ph-plus"></i> Add More</span>
        </button>
        <div class="upload-actions upload-actions-stacked">
          <button id="editorUploadSubmit" class="save-button upload-submit-button" type="button"><span class="upload-submit-fill"></span><span class="upload-submit-content"><i class="ph-bold ph-upload-simple"></i><span id="editorUploadSubmitLabel">Upload</span></span></button>
          <button id="editorUploadCancel" class="ghost-button upload-cancel-button hidden" type="button">Cancel upload</button>
        </div>
      </div>
    </div>

    <button id="editorUploadResume" class="upload-resume hidden" type="button" aria-label="Show upload progress"><i class="ph-bold ph-cloud-arrow-up"></i><span id="editorUploadResumeLabel">Uploading...</span></button>

  </body>
</html>
