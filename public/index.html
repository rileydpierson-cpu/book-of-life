<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeServer</title>
    <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/duotone/style.css" />
    <link rel="stylesheet" href="/vendor/phosphor/bold/style.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/media-viewer.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="homeButton" class="topbar-brand" type="button" aria-label="Go to newest entry">
          <span class="topbar-brand-mark" aria-hidden="true"><i class="ph-fill ph-book-open"></i><span class="topbar-brand-name">LifeServer</span></span>
          <span class="topbar-brand-copy">
            
            <span id="topbarDateLabel" class="topbar-brand-subtitle">Memory browser</span>
          </span>
        </button>

        <form id="searchForm" class="search-shell hidden" autocomplete="off">
          <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
          <input id="searchInput" type="search" placeholder="Search journals by text or date" />
          <button id="clearSearch" type="button" class="ghost-button search-clear-button hidden">Clear</button>
          <button id="searchCloseButton" type="button" class="ghost-button icon-button" aria-label="Close search"><i class="ph-bold ph-x"></i></button>
        </form>

        <div id="topbarActions" class="topbar-actions">
          <button id="uploadTopbarButton" class="ghost-button icon-button" type="button" aria-label="Upload files"><i class="ph-bold ph-plus"></i></button>
          <button id="searchToggleButton" class="ghost-button icon-button" type="button" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button>
          <button id="settingsButton" class="profile-button" type="button" aria-label="Open settings">
            <span class="profile-avatar" aria-hidden="true">LS</span>
          </button>
        </div>
      </header>

      <div class="workspace">
        <main class="main-stage">
          <section id="homeView" class="home-view">
            <section id="yearSection" class="year-section">
              <div class="section-header">
                <div style="width: min(100%, 600px); margin: auto;">
                  <h1 id="yearSectionTitle" class="section-title">Book of Life</h1>
                  <p id="yearSectionSubtitle" style="display: flex;" class="section-subtitle"></p>
                </div>
              </div>

              <div class="year-carousel-shell">
                <button id="yearBackButton" class="carousel-nav" type="button" aria-label="Scroll years left"><i class="ph-bold ph-caret-left"></i></button>
                <div id="yearCarousel" class="year-carousel"></div>
                <button id="yearNextButton" class="carousel-nav" type="button" aria-label="Scroll years right"><i class="ph-bold ph-caret-right"></i></button>
              </div>
            </section>

            <section id="timelineSection" class="timeline-section">
              <div id="timelinePane" class="timeline-pane">
                <div id="timelineTopSpacer" class="timeline-spacer"></div>
                <div id="timelineFeed" class="timeline-feed"></div>
                <div id="timelineBottomSpacer" class="timeline-spacer"></div>
              </div>
            </section>
          </section>

          <section id="explorerView" class="explorer-view hidden" aria-live="polite">
            <div class="explorer-shell">
              <div class="explorer-head">
                <button id="explorerBackButton" class="back-link icon-button" type="button" aria-label="Go back"><i class="ph-bold ph-caret-left"></i></button>
                <div class="explorer-heading-copy">
                  <h2 id="explorerTitle" class="explorer-title"></h2>
                  <p id="explorerSubtitle" class="explorer-subtitle"></p>
                </div>
              </div>
              <div id="explorerGrid" class="explorer-grid"></div>
            </div>
          </section>
        </main>
      </div>

      <div id="scrollYearMarks" class="scroll-year-marks" aria-hidden="true"></div>

      <div id="jumpLoader" class="jump-loader hidden" aria-live="polite"><i class="ph ph-spinner-gap is-spinning"></i><span id="jumpLoaderLabel">Loading...</span></div>

      <div id="scrollHandle" class="scroll-handle" aria-hidden="true">
        <div id="scrollThumb" class="scroll-thumb">
          <span id="scrollThumbLabel" class="scroll-thumb-label">-</span>
          <button id="scrollGrabber" class="scroll-grab" type="button" aria-label="Drag timeline position">
            <i class="ph-bold ph-dots-six-vertical"></i>
          </button>
        </div>
      </div>

      <button id="scrollTopButton" class="scroll-top-button" type="button" aria-label="Scroll to newest"><i class="ph-bold ph-arrow-up"></i></button>
    </div>

    <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-backdrop"></div>
      <div class="settings-window">
        <div class="settings-window-head">
          <h2>Settings</h2>
          <button id="settingsCloseButton" class="ghost-button icon-button" type="button" aria-label="Close settings"><i class="ph-bold ph-x"></i></button>
        </div>
        <div class="settings-layout">
          <section class="settings-hero">
            <span class="settings-avatar" aria-hidden="true">BoL</span>
            <div class="settings-hero-copy">
              <h3>Book of Life</h3>
              <p>Quick controls for browsing, capturing, and customizing your journal.</p>
            </div>
          </section>

          <div class="settings-grid">
            <section class="settings-panel">
              <div class="settings-label">Quick Actions</div>
              <div class="settings-action-list">
                <button id="settingsHomeButton" class="settings-action-button" type="button"><i class="ph-fill ph-house"></i><span>Newest entry</span></button>
                <button id="settingsTodayButton" class="settings-action-button" type="button"><i class="ph-duotone ph-calendar-dots"></i><span>Open today</span></button>
                <button id="settingsUploadButton" class="settings-action-button" type="button"><i class="ph-duotone ph-images-square"></i><span>Upload files</span></button>
              </div>
            </section>

            <section class="settings-panel">
              <div class="settings-label">Appearance</div>
              <div class="theme-choice-row">
                <button id="themeLight" class="theme-choice" type="button" data-theme-choice="light">Light</button>
                <button id="themeDark" class="theme-choice" type="button" data-theme-choice="dark">Dark</button>
              </div>
            </section>

            <section class="settings-panel">
              <div class="settings-label">Account</div>
              <button id="logoutButton" class="theme-choice settings-logout" type="button"><i class="ph-bold ph-sign-out"></i> Logout</button>
            </section>
          </div>
        </div>
      </div>
    </div>

    <div id="uploadModal" class="upload-modal hidden" role="dialog" aria-modal="true" aria-label="Upload media">
      <div class="upload-backdrop"></div>
      <div class="upload-window">
        <div class="settings-window-head">
          <h2 id="uploadTitle">Add media</h2>
          <button id="uploadClose" class="ghost-button icon-button" type="button" aria-label="Close upload"><i class="ph-bold ph-x"></i></button>
        </div>
        <button id="uploadFolderButton" class="upload-folder-button" type="button">
          <span class="upload-folder-icon"><i class="ph-duotone ph-folder-open"></i></span>
          <strong id="uploadFolderLabel">Choose a folder</strong>
        </button>
        <div class="upload-folder-tree-shell">
          <button id="uploadNewFolder" class="ghost-button icon-button" type="button" aria-label="Create folder"><i class="ph-bold ph-plus"></i></button>
          <div id="uploadFolderTree" class="upload-folder-tree"></div>
        </div>
        <label class="upload-file-input hidden" aria-hidden="true">
          <input id="uploadFileInput" type="file" multiple accept="image/*,video/*,.heic,.heif,.mov,.mp4,.m4v,.webm,.avi,.mkv,.3gp" />
        </label>
        <p class="section-subtitle">Files are uploaded as-is. Preview generation in the browser does not alter the original file metadata.</p>
        <div id="uploadSelectionLoading" class="upload-selection-loading hidden" aria-live="polite"><i class="ph ph-spinner-gap is-spinning"></i><span>Preparing previews...</span></div>
        <div id="uploadPreviewList" class="upload-preview-list upload-preview-list-view"></div>
        <div class="upload-shared-date-shell">
          <label class="upload-check-row">
            <input id="uploadSetExifDate" type="checkbox" />
            <span id="uploadExifDateLabel">Override LifeServer datestamp</span>
          </label>
          <input id="uploadSharedDate" class="upload-shared-date-input" type="date" disabled />
        </div>
        <button id="uploadAddFiles" class="upload-file-picker" type="button">
          <span><i class="ph-duotone ph-images-square"></i> Add Files</span>
        </button>
        <div class="upload-actions upload-actions-stacked">
          <button id="uploadSubmit" class="save-button upload-submit-button" type="button"><span class="upload-submit-fill"></span><span class="upload-submit-content"><i class="ph-bold ph-upload-simple"></i><span id="uploadSubmitLabel">Upload</span></span></button>
          <button id="uploadCancel" class="ghost-button upload-cancel-button hidden" type="button">Cancel upload</button>
        </div>
      </div>
    </div>

    <button id="uploadResume" class="upload-resume hidden" type="button" aria-label="Show upload progress"><i class="ph-bold ph-cloud-arrow-up"></i><span id="uploadResumeLabel">Uploading...</span></button>

    <script src="/vendor/exifr/full.umd.js" defer></script>
    <script src="/media-viewer.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
